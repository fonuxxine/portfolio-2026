<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Samira Dang</title>
<script>
/* Refresh keeps your place: the case study notes that it is open, so reloading the portfolio brings you
   straight back to it. Going home with "back" or the blob clears the note; the browser's back button is left alone. */
try {
  var nav = (performance.getEntriesByType("navigation")[0] || {}).type;
  if (nav === "back_forward") sessionStorage.removeItem("samirad-page");
  else if (sessionStorage.getItem("samirad-page") === "context-cards") location.replace("context-cards.html");
} catch (e) {}
/* Hide the case study images from the very first paint, so nothing shows before their wipe runs
   (skipped for reduced motion or browsers without IntersectionObserver: they just show the images). */
try {
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches && "IntersectionObserver" in window)
    document.documentElement.classList.add("wipe-armed");
} catch (e) {}
/* Arriving from the case study's "back" link: open at the very top, not wherever the page was left. */
try {
  if (sessionStorage.getItem("samirad-top")) {
    sessionStorage.removeItem("samirad-top");
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    scrollTo(0, 0);
    addEventListener("DOMContentLoaded", function () { scrollTo(0, 0); });
    addEventListener("load", function () { scrollTo(0, 0); });
  }
} catch (e) {}
</script>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="img/icon-16.png">

<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,600..800&display=swap">
<style>
/* Layout: the portfolio-v4 frame (1728 wide) with an 846px centered work column; slides keep their 846:540 ratio and scale down. */
/* Obviously Demo ships with the page; Archivo at an expanded width covers any glyph the demo cut leaves out. */
@font-face { font-family: "Ob Wide"; font-weight: 600; font-display: swap; src: url("fonts/ObviouslyDemo-WideSemibold.otf") format("opentype"); }
@font-face { font-family: "Ob Ext"; font-weight: 700; font-display: swap; src: url("fonts/ObviouslyDemo-ExtendedBold.otf") format("opentype"); }
@font-face { font-family: "Ob Semi"; font-weight: 600; font-display: swap; src: url("fonts/ObviouslyDemo-Semibold.otf") format("opentype"); }
:root {
  --paper: #ffffff;
  --ink: #4a3e3e;
  --dim: #9c9191;
  --clay: #c9695a;
  --glass: rgba(217, 217, 217, 0.2);
  --glass-line: #ebddda;
  --f-wide: "Ob Wide", "Archivo", system-ui, sans-serif;
  --f-ext: "Ob Ext", "Archivo", system-ui, sans-serif;
  --f-semi: "Ob Semi", "Archivo", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); }
/* Paper grain over the whole page: fractal noise tiles at 15%, multiplied so it only darkens.
   Fixed and click-through, so it stays put while the page scrolls under it. */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 240px auto; background-repeat: repeat;
  opacity: .15; mix-blend-mode: multiply;
}
img { max-width: 100%; display: block; }

/* Header row: logo, then nav one nav-gap (48px) after it, so name→about matches about→befriend.
   The work column's left edge follows "about", and the column is centered, so images grow with the window. */
/* ---------- Layout grid ----------
   A responsive column grid (the Material / Bootstrap / Apple HIG model): fluid columns, fixed gutters and margins,
   stepping down 16 → 8 → 4 columns. Every block snaps to column lines, so "about" and the case studies share one
   edge without any measuring. Vertical spacing uses an 8pt scale. Press G to show the columns.
     XL ≥1440   16 col · 32 gutter · 80 margin   logo 1–3 · about 4 · befriend 48px after · work 4–13 (3 columns each side) · blob ends on 16
     XXL ≥2000  20 col · 32 gutter · 80 margin   logo 2–4 · about 5 · work 5–16 · blob ends on 19
     XXXL ≥2880 24 col · 32 gutter · 80 margin   logo 2–4 · about 5 · work 5–20 · blob ends on 23
     L  1080–   16 col · 24 gutter · 48 margin   same placement as XL
   When columns 1–3 get too narrow for the name, all the type scales down together (see --k, set by script),
   with line heights rounded up to the 8px rows.
     M  640–    8 col  · 24 gutter · 32 margin   logo row, nav row below · work 1–8
     S  <640    4 col  · 16 gutter · 16 margin   work 1–4
   Columns are added as the screen widens (16 → 20 → 24); the grid stops growing at 3840px and centres beyond that. */
:root { --cols: 16; --gutter: 32px; --margin: 80px; --site-max: 3840px; --k: 1; --name-span: 3;
  /* Type principle: "samirad." is set like "in context" (Obviously Extended Bold), and "Understand language"
     is the same size as "samirad.". All three share one display size, which scales together. */
  --display: calc(36px * var(--k)); --display-track: -0.03em; }
.site, .grid-overlay {
  max-width: var(--site-max); margin-inline: auto;
  padding-left: max(var(--margin), env(safe-area-inset-left, 0px)); padding-right: max(var(--margin), env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); column-gap: var(--gutter);
}
.site { position: relative; }
.top {
  grid-column: 1 / -1; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); column-gap: var(--gutter);
  align-items: baseline; padding-top: 40px;
  grid-template-rows: var(--lh-logo, 56px);   /* header height = name's line height, always on the 8px rows */
}
.logo {
  grid-column: 1 / span 3; grid-row: 1; justify-self: start; white-space: nowrap;
  margin: 0; line-height: var(--lh-logo, 56px);
  font-family: var(--f-ext); font-weight: 700; font-stretch: 125%; font-size: var(--display); letter-spacing: var(--display-track);
  color: var(--ink); text-decoration: none;
}
/* "about" starts on the work column's line; "befriend" follows 48px after it (not on a column). */
.nav { grid-column: 4 / span 10; grid-row: 1; display: flex; gap: 48px; }
.nav a {
  font-family: var(--f-ext); font-weight: 700; font-stretch: 125%; font-size: max(12px, calc(16px * var(--k))); line-height: var(--lh-nav, 24px); letter-spacing: calc(-0.48px * var(--k));
  color: var(--dim); text-decoration: none; transition: color .25s ease;
}
.nav a:hover { color: var(--ink); }
/* Blob ends on the last column (16), mirroring the name on column 1. */
/* Vertically centred on the letters of the name (ink 57–87px in its 56px line), not on the line box. */
.blob { grid-column: 16 / 17; grid-row: 1; justify-self: end; align-self: start; margin-top: 11px; position: relative; width: 42px; height: 42px; padding: 1.5px 0 1.6px 2.1px; }
.blob img { width: 39.6px; height: 38.7px; transition: transform .5s cubic-bezier(.34, 1.56, .64, 1); }
.blob:hover img { transform: scale(1.08); }
/* Invisible hit area: 32px of extra hover and tap room on every side of the blob, at every size
   (divided by k because the blob itself is scaled by k). */
.blob::before { content: ""; position: absolute; inset: calc(-32px / var(--k)); border-radius: 50%; }
/* Hover tooltip: a small pane of the same frosted glass as the slide frames, ink type in the wide cut,
   with the shortcut in a clay-tinted key. It drops in from the blob, anchored to the right edge so it never runs off screen. */
.tip {
  position: absolute; top: calc(100% + 12px); right: -6px; z-index: 5; display: flex; align-items: center; gap: 8px;
  padding: 6.5px 6.5px 6.5px 13.5px; border-radius: 999px; white-space: nowrap; pointer-events: none;   /* +0.5px each side for the removed outline */
  /* Glass: a thin, top-lit white wash over a strong blur, so whatever sits behind shows through softened,
     a bright rim along the top edge and a fainter one along the bottom, plus Figma UI3 light/elevation-100. */
  /* Coloured glass: a faint clay tint (the blob's own colour, ~8–12%) under the top-lit white wash,
     a white top rim and a bottom rim warmed toward clay, like light passing through tinted glass. No white outline. */
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.10)),
    linear-gradient(180deg, rgba(201, 105, 90, 0.08), rgba(201, 105, 90, 0.12));
  border: 0;
  -webkit-backdrop-filter: blur(16px) saturate(1.7) brightness(1.04); backdrop-filter: blur(16px) saturate(1.7) brightness(1.04);
  box-shadow: 0 0 0.5px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.15);
  font-family: var(--f-wide); font-weight: 600; font-stretch: 112%; font-size: 13px; line-height: 1; letter-spacing: -0.02em; color: var(--ink);
  opacity: 0; transform: translateY(-4px) scale(.96); transform-origin: top right;
  transition: opacity .16s ease, transform .3s cubic-bezier(.34, 1.4, .64, 1);
}
/* The rim light: a white highlight and a pink one on opposite sides of a 1px ring, running around the pill
   (one lap every 4s) while the tooltip is showing. Reduced motion keeps them still: white on top, pink below. */
@property --tip-a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.tip::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: conic-gradient(from var(--tip-a),
    rgba(255, 255, 255, 0.95) 0deg, rgba(255, 255, 255, 0) 70deg,
    rgba(217, 150, 140, 0) 110deg, rgba(217, 150, 140, 0.6) 180deg, rgba(217, 150, 140, 0) 250deg,
    rgba(255, 255, 255, 0) 290deg, rgba(255, 255, 255, 0.95) 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  animation: tip-run 4s linear infinite; animation-play-state: paused;
}
.blob:hover .tip::before, .blob:focus-visible .tip::before { animation-play-state: running; }
@keyframes tip-run { to { --tip-a: 360deg; } }
@media (prefers-reduced-motion: reduce) { .tip::before { animation: none; } }
.tip kbd {
  font-family: var(--f-semi); font-weight: 600; font-size: 11px; line-height: 1; letter-spacing: .04em; color: var(--clay);
  background: rgba(201, 105, 90, 0.16); border: 0.5px solid rgba(201, 105, 90, 0.34); border-radius: 999px; padding: 4px 8px;
}
/* The blob scales with the display type (same factor as "samirad."); the tooltip inside keeps its own size. */
.blob { zoom: var(--k); }
.blob .tip { zoom: calc(1 / var(--k)); }
.blob:hover .tip, .blob:focus-visible .tip { opacity: 1; transform: none; transition-delay: .08s; }
@media (prefers-reduced-motion: reduce) { .tip { transform: none; transition: opacity .16s ease; } }
/* Live blob: a canvas the size of the logo plus 16px each side for its glow, centred on the img so both
   scale about the same point. Once it mounts it replaces the img; on hover the middle warms to yellow and rolls like sound. */
.blob canvas { position: absolute; left: -13.9px; top: -14.5px; width: 71.6px; height: 70.7px; pointer-events: none; opacity: 0;
  transition: transform .5s cubic-bezier(.34, 1.56, .64, 1); }
.blob.live canvas { opacity: 1; }
.blob.live img { visibility: hidden; }
.blob:hover canvas, .blob:focus-visible canvas { transform: scale(1.08); }

/* Work column: starts on the same column line as "about". 96px between case studies.
   Columns 4–13, so three columns sit on each side of them. */
main { grid-column: 4 / span 10; min-width: 0; display: grid; gap: 96px; padding-block: 96px 128px; }   /* header → first case study and between case studies: 96px each */   /* space between case studies: 96px (on the 4/8px scale) */

/* Wider screens add columns instead of stretching them, keeping columns roughly 75–125px.
   The name steps in to column 2 and the blob to the second-last column, mirroring each other;
   the case studies sit between with four columns on each side.
   XXL  ≥2000  20 col   name 2–4 · about + work 5–16 · blob ends on 19
   XXXL ≥2880  24 col   name 2–4 · about + work 5–20 · blob ends on 23 */
@media (min-width: 2000px) {
  :root { --cols: 20; --name-span: 3; }
  main { gap: 144px; padding-top: 136px; }   /* wide screens keep the original spacing */
  .logo { grid-column: 2 / span 3; }
  .nav { grid-column: 5 / span 12; }
  main { grid-column: 5 / span 12; }
  .blob { grid-column: 19 / 20; }
}
@media (min-width: 2880px) {
  :root { --cols: 24; }
  .nav { grid-column: 5 / span 16; }
  main { grid-column: 5 / span 16; }
  .blob { grid-column: 23 / 24; }
}
/* Up to 1546px: the same shape as the tablet layout, on the 16-column grid. Name on its own row,
   "about" + "befriend" on the row below starting at column 1, and the case studies span all 16 columns,
   so "about" still lines up with the images. */
@media (max-width: 1546px) {
  :root { --name-span: 15; }
  .top { row-gap: 8px; grid-template-rows: var(--lh-logo, 56px) var(--lh-nav, 24px); }
  .logo { grid-column: 1 / span 15; }
  .nav { grid-column: 1 / -1; grid-row: 2; }
  main { grid-column: 1 / -1; }
}
@media (max-width: 1439px) {
  :root { --gutter: 24px; --margin: 48px; }
}
@media (max-width: 1079px) {
  :root { --cols: 8; --gutter: 24px; --margin: 32px; }
  .top { padding-top: 24px; row-gap: 8px; grid-template-rows: var(--lh-logo, 56px) var(--lh-nav, 24px); }
  .logo { grid-column: 1 / span 6; }
  .blob { grid-column: -2 / -1; }
  .nav { grid-column: 1 / -1; grid-row: 2; }
  main { grid-column: 1 / -1; padding-block: 64px 96px; gap: 64px; }
}
@media (max-width: 639px) {
  :root { --cols: 4; --gutter: 16px; --margin: 16px; }
  .logo { grid-column: 1 / span 3; }
}

/* Grid overlay for checking alignment: press G. */
.grid-overlay { position: fixed; inset: 0; z-index: 9000; pointer-events: none; opacity: 0; transition: opacity .2s ease; }
.grid-overlay span { background: rgba(232, 72, 85, 0.07); box-shadow: inset 1px 0 rgba(232, 72, 85, 0.25), inset -1px 0 rgba(232, 72, 85, 0.25); }
html.show-grid .grid-overlay { opacity: 1; }
.grid-overlay span { position: relative; }
.grid-overlay b, .grid-overlay i {
  position: absolute; left: 0; right: 0; text-align: center; font: 600 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
  font-style: normal; color: rgba(200, 40, 60, 0.75); font-variant-numeric: tabular-nums;
}
.grid-overlay b { top: 8px; }
.grid-overlay i { top: 21px; font-weight: 400; color: rgba(200, 40, 60, 0.5); }
.grid-info {
  position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 9001;
  pointer-events: none; padding: 6px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 0 0 0.5px rgba(200, 40, 60, 0.35), 0 1px 3px rgba(0, 0, 0, 0.12);
  font: 500 11px/1.3 ui-monospace, "SF Mono", Menlo, monospace; color: rgba(150, 30, 45, 0.95); font-variant-numeric: tabular-nums;
  opacity: 0; transition: opacity .2s ease; max-width: calc(100vw - 24px);
}
.grid-info b { color: #c8283c; margin-right: 2px; }
.grid-info span { color: rgba(150, 30, 45, 0.55); margin-left: 6px; }
html.show-grid .grid-info { opacity: 1; }
/* Baseline rows: a line every 8px down the whole page, stronger every 64px; they scroll with the content. */
.grid-rows {
  position: absolute; left: 0; right: 0; top: 0; z-index: 8999; pointer-events: none; opacity: 0; transition: opacity .2s ease;
  background-image:
    repeating-linear-gradient(to bottom, rgba(40, 110, 220, 0.30) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(to bottom, rgba(40, 110, 220, 0.12) 0 1px, transparent 1px 8px);
}
html.show-grid .grid-rows { opacity: 1; }

.project { display: grid; }
/* Labels stay at 12px: they are already the smallest type, so they never scale down. */
.eyebrow { font-family: var(--f-semi); font-weight: 600; font-size: 12px; line-height: 16px; letter-spacing: -0.36px; color: var(--dim); margin: 0; }
.project h2 {
  margin: 0 0 24px; font-family: var(--f-wide); font-weight: 600; font-stretch: 112%; font-size: var(--display);
  letter-spacing: var(--display-track); line-height: var(--lh-title, 48px); color: var(--ink);
}
/* Typing effect on the first title: letters are laid out from the start (no layout shift) and revealed in turn. */
.tc { visibility: hidden; }
.tc.on { visibility: visible; }
/* After a title's first line types, its label fades in while sliding up 12px, easing to a stop (as on palantir.com/offerings/fedstart). */
.eyebrow { transition: opacity .6s ease, transform .8s cubic-bezier(.16, 1, .3, 1); }
.eyebrow.eb-wait { opacity: 0; transform: translateY(12px); }
.project h2 b { display: block; font-family: var(--f-ext); font-weight: 700; font-stretch: 125%; }

/* Glass frame: a thin frosted rim around each slide, tinted by that slide's own gradient,
   with a hairline edge that catches light at the top (like a pane of glass lit from above). */
.gframe {
  position: relative; isolation: isolate; padding: 8px; border-radius: 26px; overflow: hidden;
  background: rgba(255, 255, 255, 0.55);
  box-shadow:
    inset 0 0 0 1px rgba(74, 62, 62, 0.07),
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    0 1px 2px rgba(74, 62, 62, 0.05),
    0 18px 40px -18px rgba(74, 62, 62, 0.28);
}
.gframe::before {
  content: ""; position: absolute; inset: -24px; z-index: -1; background: var(--bg);
  filter: blur(22px) saturate(1.15); opacity: .38; transition: opacity .6s ease;
}
.gframe:hover::before { opacity: .55; }
/* Case study images wipe open from the top down, as videos do on the Figma blog: once an image is about
   100px into view (straight away for the ones on screen when the page opens), a clip slides from its top edge
   to its bottom in 0.6s, slow at both ends. The clip reaches 60px past the frame so its shadow is kept. */
/* Armed from the head (html.wipe-armed), so the frames are hidden before anything paints; .done lifts the clip afterwards. */
html.wipe-armed .gframe { clip-path: inset(-60px -60px calc(100% + 60px) -60px); transition: clip-path .6s cubic-bezier(.65, 0, .35, 1); }
html.wipe-armed .gframe.in { clip-path: inset(-60px -60px -60px -60px); }
html.wipe-armed .gframe.done { clip-path: none; transition: none; }
.slide { position: relative; aspect-ratio: 846 / 540; overflow: hidden; container-type: inline-size; border-radius: 18px; display: block; }
.slide::after {
  content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: inherit; padding: 1px;
  background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.18) 22%, rgba(255,255,255,.06) 60%, rgba(255,255,255,.22));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.slide canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 1.1s ease; }
/* at rest the slide shows its exact Figma gradient; the live canvas fades in over it on hover */
.slide.live canvas { opacity: 1; transition-duration: .5s; }
.slide > .layer { position: absolute; inset: 0; }
/* place children in Figma's 846 x 540 coordinates */
.at { position: absolute; left: calc(var(--x) / 846 * 100%); top: calc(var(--y) / 540 * 100%); width: calc(var(--w) / 846 * 100%); height: calc(var(--h) / 540 * 100%); }
.glass { background: var(--glass); border: 0.5px solid var(--glass-line); border-radius: 20px 20px 0 0; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.shot { border-radius: 16px 16px 0 0; overflow: hidden; }
.shot img, .shot video { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
/* The new-word recording is cropped just below its card (the keyboard is cut away);
   the rest of the phone is filled with the dimmed screen grey that sits behind the sheet. */
.shot.cropped { background: #cbcbcb; }
.shot.cropped video { height: auto; }
.win img, .win video { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Mac-window corners on all three windows: 10px at Figma's 846px slide width, scaling with the slide. */
.win.rounded { border-radius: calc(10 / 846 * 100cqw); overflow: hidden; }
/* Figma UI3 light/elevation-400 (menu panel) on each of the three windows. */
.win { box-shadow: 0 0 0.5px rgba(0,0,0,.12), 0 2px 5px rgba(0,0,0,.15), 0 10px 16px rgba(0,0,0,.12); }
/* Figma UI3 light/elevation-500 (modal window): hairline ring, two soft drops and a wide ambient shadow. */
.game { border-radius: 8px; overflow: hidden;
  box-shadow: 0 0 0.5px rgba(0,0,0,.08), 0 2px 5px rgba(0,0,0,.15), 0 3px 12px rgba(0,0,0,.05), 0 10px 24px rgba(0,0,0,.18); }
.game img, .game video { width: 100%; height: 100%; object-fit: cover; display: block; }
.slide .lift { transition: transform .7s cubic-bezier(.22, 1, .36, 1); }
/* group wrappers fill the slide, so a hover transform keeps the phones' 846x540 coordinates */
.layer > .lift:not(.at) { position: absolute; inset: 0; }
.slide:hover .lift.l1 { transform: translateY(-1.5%); }
.slide:hover .lift.l2 { transform: translateY(-3%); }
.slide:hover .lift.l3 { transform: translateY(-1%) scale(1.01); }


/* custom cursor, mouse and trackpad only */
@media (hover: hover) and (pointer: fine) {
  html.has-cursor, html.has-cursor * { cursor: none !important; }
}
/* The blob's centre (11.6, 10.1 in Figma units) sits exactly on the pointer in both states.
   Rest: the solid core at full size. Hover: core at 60%, halo at 120% (Figma's 1:2 ratio, 1.2x Figma size). */
.cursor { position: fixed; left: 0; top: 0; width: 30px; height: 30px; pointer-events: none; z-index: 1000; opacity: 0; transition: opacity .2s ease; transform-origin: 15.6px 14.1px; }
.cursor.on { opacity: 1; }

    if (on > .01) {
      ctx.save(); ctx.shadowColor = rgba(Math.min(1, S.glow * (.25 + .75 * L) * on));
      ctx.shadowBlur = (2 + S.glow * 9 * (.2 + L)) * dpr; ctx.fillStyle = rgba(1); ctx.fill(shape); ctx.restore();

    t += dt;
    var target = voice();
    level += (target - level) * (1 - Math.exp(-dt / (target > level ? .04 : .18)));
    soft += (level - soft) * (1 - Math.exp(-dt / S.smooth));

/* Horizontal layout comes from the CSS grid. Script only keeps the vertical rhythm:
   space between case studies = space from the bottom of "about" to the first case study's label. */
(function () {
  var nav = document.querySelector(".nav a"), root = document.documentElement;   // "about"
  var logo = document.querySelector(".logo"), blob = document.querySelector(".blob"), site = document.querySelector(".site");
  var up8 = function (v) { return Math.max(8, Math.ceil(v / 8) * 8) + "px"; };
  /* Type scale: the name must fit in the space it owns (columns 1–3 less a gutter on large screens, the row
     beside the blob on smaller ones). When it doesn't, every text size scales by the same factor k,
     so the type keeps its proportions; line heights round up to the 8px rows. */
  function typeScale() {
    var st = getComputedStyle(site), cols = parseInt(getComputedStyle(root).getPropertyValue("--cols"), 10);
    var inner = site.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight);
    var g = parseFloat(st.columnGap), c = (inner - (cols - 1) * g) / cols;
    var span = parseInt(getComputedStyle(root).getPropertyValue("--name-span"), 10) || 3;
    var avail = cols >= 16 ? span * c + (span - 1) * g - Math.max(g, 32) : inner - 42 - g;   // 42 = blob
    var k0 = parseFloat(getComputedStyle(root).getPropertyValue("--k")) || 1;
    var natural = logo.getBoundingClientRect().width / k0;                       // name width at 36px
    var k = Math.min(1, avail / natural);
    // Every title line ("Understand language", "through gameplay", ...) must also fit on one line in the
    // work column; on phones this is what sets the scale. Measured at full size, then shared by all display type.
    var workW = document.querySelector("main").clientWidth, widest = 0;
    document.querySelectorAll(".project h2").forEach(function (h) {
      var b = h.querySelector("b");
      var line1 = h.textContent.replace(b.textContent, "").trim();   // works while the title is being typed too
      [[h, line1], [b, b.textContent.trim()]].forEach(function (pair) {
        var p = document.createElement("span");
        p.textContent = pair[1];
        p.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;display:inline-block";
        pair[0].appendChild(p);
        widest = Math.max(widest, p.getBoundingClientRect().width / k0);
        p.remove();
      });
    });
    if (widest > 0) k = Math.min(k, (workW - 2) / widest);
    root.style.setProperty("--k", k.toFixed(4));
    root.style.setProperty("--lh-logo", up8(56 * k));
    root.style.setProperty("--lh-title", up8(48 * k));
    root.style.setProperty("--lh-nav", up8(24 * Math.max(k, .75)));
    // keep the blob centred on the letters of the name: ink runs from 0.796 em above the baseline to 0.024 em below
    var probe = document.createElement("span");
    probe.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
    logo.appendChild(probe);
    var base = probe.getBoundingClientRect().top; probe.remove();
    var f = 36 * k, inkMid = base - 0.386 * f, rowTop = logo.getBoundingClientRect().top;
    // the blob is zoomed by k, so its own margin is in zoomed px: centre = rowTop + mt*k + 21k
    blob.style.marginTop = ((inkMid - rowTop) / k - 21).toFixed(2) + "px";
    pinBlob(k);
  }
  /* Keep the blob in place while the page scrolls: measure where the layout puts it (page at the top),
     then fix it there. Offsets are divided by k because the blob is zoomed by k. */
  function pinBlob(k) {
    var st = blob.style;

    st.top = ((r.top + scrollY) / k - mt).toFixed(2) + "px";
    st.right = ((document.documentElement.clientWidth - r.right) / k).toFixed(2) + "px";
  }
  function measure() {
    typeScale();
    // When the type scales, the header's height changes; nudge the space above the first case study
    // (0–7px) so its label still starts on a baseline row.
    var m = document.querySelector("main"), eb0 = document.querySelector(".eyebrow");
    m.style.paddingTop = "";
    // measured from the title below it (the label itself may be mid-slide)
    var ebTop = eb0.nextElementSibling.getBoundingClientRect().top + scrollY - eb0.offsetHeight;
    var off = ebTop % 8;
    if (off > 0.01) m.style.paddingTop = (parseFloat(getComputedStyle(m).paddingTop) + 8 - off).toFixed(2) + "px";
    // Round each slide's height to the nearest 8px (at most 4px off its 846:540 shape, under 1%),
    // so frames end on a baseline row and the 96px gap between case studies stays exact.
    document.querySelectorAll(".slide").forEach(function (sl) {
      var h = sl.clientWidth * 540 / 846;
      sl.style.aspectRatio = "auto"; sl.style.height = Math.max(8, Math.round(h / 8) * 8) + "px";
    });
  }
  measure();
  addEventListener("resize", measure);
  if (document.fonts) document.fonts.ready.then(measure);
})();

/* Grid overlay (on for now, press G to hide): numbered columns plus a readout of the live grid numbers. */
(function () {
  var root = document.documentElement, ov = document.createElement("div"), info = document.createElement("div");
  ov.className = "grid-overlay"; ov.setAttribute("aria-hidden", "true");
  for (var i = 1; i <= 24; i++) { var s = document.createElement("span"); s.innerHTML = "<b>" + i + "</b><i></i>"; ov.appendChild(s); }
  info.className = "grid-info"; info.setAttribute("aria-hidden", "true");
  var rows = document.createElement("div"); rows.className = "grid-rows"; rows.setAttribute("aria-hidden", "true");
  document.body.appendChild(ov); document.body.appendChild(info); document.body.appendChild(rows);
  // off by default; press G to show the columns, rows and readout
  // The page's real height: the bottom of its content, leaving out these overlays and the redlines layer.
  // Measuring scrollHeight instead let each overlay hold the page at its old height after a resize.
  function contentHeight() {
    var m = innerHeight;
    [].forEach.call(document.body.children, function (c) {
      if (c.matches(".grid-rows, .grid-overlay, .grid-info, .sp-layer, .sp-chip, script, style")) return;
      var cs = getComputedStyle(c); if (cs.position === "fixed" || cs.display === "none") return;
      m = Math.max(m, c.getBoundingClientRect().bottom + scrollY + (parseFloat(cs.marginBottom) || 0));
    });
    return Math.ceil(m);
  }
  function update() {
    rows.style.height = contentHeight() + "px";
    var cs = getComputedStyle(root), cols = parseInt(cs.getPropertyValue("--cols"), 10);
    var spans = ov.querySelectorAll("span"), first = spans[0].getBoundingClientRect();
    var gutter = cols > 1 ? spans[1].getBoundingClientRect().left - first.right : 0;
    var vw = root.clientWidth, siteW = Math.min(vw, parseInt(cs.getPropertyValue("--site-max"), 10));
    var margin = first.left - (vw - siteW) / 2;
    var bp = vw >= 2880 ? "XXXL" : vw >= 2000 ? "XXL" : vw >= 1440 ? "XL" : vw >= 1080 ? "L" : vw >= 640 ? "M" : "S";
    var work = document.querySelector("main").getBoundingClientRect();
    for (var k = 0; k < spans.length; k++) spans[k].style.display = k < cols ? "block" : "none";
    for (var k = 0; k < cols; k++) spans[k].querySelector("i").textContent = Math.round(spans[k].getBoundingClientRect().width);
    info.innerHTML = "<b>" + bp + "</b> " + vw + "px · " + cols + " columns · column " + first.width.toFixed(1) + "px · gutter " +
      Math.round(gutter) + "px · margin " + Math.round(margin) + "px · work " + Math.round(work.width) + "px · rows 8px (bold 64) · gap " +
      getComputedStyle(document.querySelector("main")).rowGap + " <span>G hides</span>";
  }
  update();
  addEventListener("resize", update);
  addEventListener("load", update);
  if (document.fonts) document.fonts.ready.then(function () { setTimeout(update, 0); });
  addEventListener("keydown", function (e) {
    if ((e.key === "g" || e.key === "G") && !e.metaKey && !e.ctrlKey && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) root.classList.toggle("show-grid");
  });
})();
document.querySelectorAll('a[href="context-cards.html"]').forEach(function (a) {
  a.addEventListener("click", function (e) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;   // new-tab clicks open as usual
    e.preventDefault(); document.documentElement.classList.add("leaving");
    setTimeout(function () { location.href = a.getAttribute("href"); }, 260);
  });
});
addEventListener("pageshow", function () { document.documentElement.classList.remove("leaving"); });   // back button restores the page
document.querySelectorAll('a[href="#"]').forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); }); });

/* Image wipe (see the CSS): arm it, then open each image once it is 100px into view. */
(function () {
  if (!document.documentElement.classList.contains("wipe-armed")) return;   // armed in the head; not for reduced motion
  var frames = document.querySelectorAll(".gframe");
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      var f = e.target;
      f.classList.add("in");
      f.addEventListener("transitionend", function end(ev) {   // only the frame's own wipe, not a child's transition
        if (ev.target !== f || ev.propertyName !== "clip-path") return;
        f.classList.add("done"); f.removeEventListener("transitionend", end);
      });
    });
  }, { rootMargin: "0px 0px -100px 0px" });
  frames.forEach(function (f) { io.observe(f); });
})();

/* Typing effect, in the manner of palantir.com: each case study title types out letter by letter
   (about 32ms a letter, no cursor) the first time it scrolls into view; the top one types on landing.
   Letters are laid out from the start, so nothing shifts. Skipped for reduced motion. */
(function () {
  if (reduce) return;
  var titles = [];
  document.querySelectorAll(".project h2").forEach(function (h, idx) {
    var original = h.innerHTML, chars = [];
    (function wrap(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (n) {
        if (n.nodeType === 3) {
          var frag = document.createDocumentFragment();
          Array.from(n.textContent).forEach(function (ch) {
            var sp = document.createElement("span"); sp.className = "tc"; sp.textContent = ch;
            frag.appendChild(sp); chars.push(sp);
          });
          n.replaceWith(frag);
        } else wrap(n);
      });
    })(h);
    h.setAttribute("aria-label", h.textContent.replace(/\s+/g, " ").trim());
    // the label waits until the first line ("Understand language") has typed, then slides up
    var label = h.previousElementSibling && h.previousElementSibling.classList.contains("eyebrow") ? h.previousElementSibling : null;
    var line1 = chars.filter(function (c) { return c.parentNode.tagName !== "B"; }).length;   // first line = letters outside <b>
    if (label) {   // hide instantly (no fade-out), then let the slide-in animate later
      label.style.transition = "none"; label.classList.add("eb-wait");
      void label.offsetHeight; label.style.transition = "";
    }
    var i = 0, started = false;
    function step() {
      while (i < chars.length && !chars[i].textContent.trim()) chars[i++].classList.add("on");   // spaces don't take a beat
      if (label && i >= line1) { label.classList.remove("eb-wait"); label = null; }
      if (i < chars.length) { chars[i++].classList.add("on"); setTimeout(step, 32); }
      else { h.innerHTML = original; h.removeAttribute("aria-label"); }   // back to plain text so kerning is exact
    }
    function go() { if (started) return; started = true; setTimeout(step, idx === 0 ? 350 : 120); }
    titles.push({ h: h, go: go, started: function () { return started; } });
  });
  // Start a title once it is fully on screen, a little above the bottom edge.
  function check() {
    var vh = innerHeight || document.documentElement.clientHeight;
    titles.forEach(function (t) {
      if (t.started()) return;
      var r = t.h.getBoundingClientRect();
      if (r.bottom <= vh * 0.9 && r.top >= 0) t.go();
    });
  }
  addEventListener("scroll", check, { passive: true });
  addEventListener("resize", check);
  check();
})();

/* Custom cursor: one blob follows the pointer and morphs into the haloed hover shape over anything clickable. */
(function () {
  if (!canHover) return;
  document.documentElement.classList.add("has-cursor");
  var el = document.getElementById("cursor");
  var x = -100, y = -100, cx = -100, cy = -100, raf = 0;
  function frame() {
    var k = reduce ? 1 : 0.32;
    cx += (x - cx) * k; cy += (y - cy) * k;   // follows the pointer, never tilts
    el.style.transform = "translate3d(" + (cx - 15.6) + "px," + (cy - 14.1) + "px,0)";
    raf = (Math.abs(x - cx) > 0.1 || Math.abs(y - cy) > 0.1) ? requestAnimationFrame(frame) : 0;
  }
  addEventListener("pointermove", function (e) {
    if (e.pointerType !== "mouse") return;
    x = e.clientX; y = e.clientY;
    if (!el.classList.contains("on")) { cx = x; cy = y; el.classList.add("on"); }
    el.classList.toggle("hover", !!(e.target.closest && e.target.closest("a, button, [role=button]")));
    if (!raf) raf = requestAnimationFrame(frame);
  }, { passive: true });
  document.addEventListener("pointerleave", function () { el.classList.remove("on"); });
  addEventListener("pointerdown", function () { el.classList.add("press"); });
  addEventListener("pointerup", function () { el.classList.remove("press"); });
})();
